[build-system]
requires = ["uv_build>=0.10.9,<0.13"]
build-backend = "uv_build"

[project]
name = "leafpress"
version = "0.8.3"
description = "Convert MkDocs sites to PDF, Word, HTML, ODT, EPUB, and Markdown documents with branding"
readme = "README.md"
authors = [{name = "Shane Hutchins", email = "hutchins@users.noreply.github.com"}]
maintainers = [
  {name = "Shane Hutchins", email = "hutchins@users.noreply.github.com"}
]
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Topic :: Text Processing :: Markup :: Markdown",
]
keywords = ["mkdocs", "pdf", "docx", "documentation", "converter"]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "markdown>=3.5",
    "pymdown-extensions>=11.0.1",
    "pygments>=2.20",
    "python-docx>=1.1.0",
    "gitpython>=3.1.60",
    "jinja2>=3.1",
    "beautifulsoup4>=4.12",
    "lxml>=6.1",
    "requests>=2.33",
    "python-dotenv>=1.0",
    "odfpy>=1.4.1",
    "ebooklib>=0.18",
    "mammoth>=1.8",
    "markdownify>=1.0",
    "python-pptx>=1.0.0",
    "openpyxl>=3.1",
    "pylatexenc>=2.10",
    "nh3>=0.3",
    "tomli>=2.3",
    "pillow>=12.3",
]

[project.optional-dependencies]
pdf = [
    "weasyprint>=70.0",
]
ui = [
    "pyqt6>=6.6.0",
    "pyobjc-framework-cocoa>=10.0; sys_platform == 'darwin'",
]
all = [
    "leafpress[pdf,ui]",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=5.0",
    "ruff>=0.5.0",
    "weasyprint>=70.0",
]

[project.scripts]
leafpress = "leafpress.cli:cli"

[project.urls]
Homepage = "https://leafpress.dev"
Repository = "https://github.com/hutchins/leafpress"

[tool.uv]
package = true

[tool.uv.build-backend]
module-root = "src"

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["./pytest-of-*", "./leafpress-mermaid-*"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/leafpress/cli/*.py" = ["B008"]
# Maps LaTeX to typographic Unicode (dashes, quotes, ×, ı, primes) on purpose
"src/leafpress/importer/tex_symbols.py" = ["RUF001", "RUF002"]
"tests/test_import_tex_improvements.py" = ["RUF001"]
"tests/test_integration_e2e.py" = ["RUF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-v --tb=short"
markers = ["docker: tests requiring Docker (may be slow)"]

[tool.coverage.run]
source = ["leafpress"]
omit = ["src/leafpress/ui/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 70
