name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install WeasyPrint system dependencies
        # poppler-utils provides pdftotext for the PDF text assertions
        run: sudo apt-get install -y libpango-1.0-0 libharfbuzz0b libpangoft2-1.0-0 libfontconfig1 poppler-utils

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uvx ty@0.0.84 check

      - name: Audit dependencies for known vulnerabilities
        run: |
          uv export --all-extras --all-groups --no-hashes --no-emit-project \
            --format requirements-txt > /tmp/requirements.txt
          uvx pip-audit==2.10.1 -r /tmp/requirements.txt --no-deps --disable-pip

      - name: Test with coverage
        run: uv run pytest tests/ --cov --cov-report=term-missing --cov-report=xml -q

  # Same secret scan as the pre-commit hook, over the full history
  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz from the release's checksums.txt
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (checksum-verified)
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum --check
          tar -xzf "$tarball" gitleaks

      - name: Scan history for secrets
        run: ./gitleaks git . --redact --no-banner

  # Desktop UI tests need PyQt6 (the ui extra), which the test job doesn't install
  ui:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Qt runtime libraries
        run: sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install dependencies (with ui extra)
        run: uv sync --group dev --extra ui

      - name: UI tests
        run: uv run pytest tests/test_ui.py -v -p no:cacheprovider

  # Exercise the composite action (action.yml) from this checkout end to end
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the leafpress action on this repo's docs
        id: leafpress
        uses: ./
        with:
          source: docs
          format: html
          # Shell syntax in an input must stay a literal path (injection regression test)
          output: "dist/$(echo injected)"

      - name: Check outputs
        env:
          FILES: ${{ steps.leafpress.outputs.files }}
        run: |
          echo "$FILES"
          test -n "$FILES"
          test -d 'dist/$(echo injected)'
          test ! -e dist/injected
          ls 'dist/$(echo injected)'/*.html

